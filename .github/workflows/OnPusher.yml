name: On Push
on:
  push:

jobs:
  Server:
    runs-on: ubuntu-latest
    steps:
      - name: Dowload repository
        uses: actions/checkout@v4
    
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: api/requirements.txt 
        
      - name: install requirements
        run: pip install -r api/requirements.txt

      - name: compileall
        run: python -m compileall api/

      - name: install node
        uses: actions/setup-node@v4
        with:
            node-version: "20"
            cache: "npm"
            cache-dependency-path: user/package.json
        
      - name: install requirements
        run: |
          cd user
          npm install
        
      - name: compileall typescript
        run: |
          cd user
          npx tsc

      - name: docker
        run: docker compose build